# 特征选择模块默认配置
methods:
  - LASSO
  - Boruta
  - RFE
  - MutualInformation
  - stepAIC
  - SCAD
  - GA

consensus_threshold: 3
random_state: 42
n_jobs: -1

method_params:
  LASSO:
    Cs: 20
    cv: 5
    max_iter: 1000
  Boruta:
    max_iter: 100
  RFE:
    step: 1
    cv: 5
    scoring: roc_auc
  MutualInformation:
    k: 20
  stepAIC:
    direction: forward
    threshold_in: 0.05
    threshold_out: 0.10
  SCAD:
    alpha: 1.0
    max_iter: 1000
  GA:
    population_size: 50
    generations: 30
    cx_prob: 0.5
    mut_prob: 0.2
